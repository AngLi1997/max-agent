[project]
name = "backend"
version = "0.1.0"
description = "Max Agent backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    "asyncpg>=0.30.0",
    "email-validator>=2.3.0",
    "fastapi-users[sqlalchemy]>=14.0.1",
    "fastapi[standard]>=0.136.1",
    "greenlet>=3.2.4",
    "httpx>=0.28.0",
    "minio>=7.2.18",
    "pydantic-settings>=2.10.1",
    "redis[hiredis]>=6.4.0",
    "sqlalchemy>=2.0.43",
    "user-agents>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
]
